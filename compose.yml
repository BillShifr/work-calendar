name: tfoms-time
services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tfoms_time}
      POSTGRES_USER: ${POSTGRES_USER:-tfoms_time}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfoms_time}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5434}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [tfoms-time]
  migrate:
    build: { context: ., target: migrator }
    command: ["npm", "run", "db:migrate"]
    environment:
      {
        DATABASE_URL: "postgres://${POSTGRES_USER:-tfoms_time}:${POSTGRES_PASSWORD:-tfoms_time}@db:5432/${POSTGRES_DB:-tfoms_time}",
      }
    depends_on: { db: { condition: service_healthy } }
    profiles: ["ops"]
    networks: [tfoms-time]
  app:
    build: .
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-tfoms_time}:${POSTGRES_PASSWORD:-tfoms_time}@db:5432/${POSTGRES_DB:-tfoms_time}"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports: ["127.0.0.1:${APP_PORT:-3080}:3000"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [tfoms-time]
networks: { tfoms-time: {} }
volumes: { postgres-data: {} }
