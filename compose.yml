name: hr
services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr}
      POSTGRES_USER: ${POSTGRES_USER:-hr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5434}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [hr]
  migrate:
    image: ${MIGRATOR_IMAGE_REPOSITORY:-hr-migrator}:${VCS_REF:-local}
    build:
      context: .
      target: migrator
      args: { VCS_REF: "${VCS_REF:-local}" }
    command: ["npm", "run", "db:migrate"]
    environment:
      {
        DATABASE_URL: "${CONTAINER_DATABASE_URL:?CONTAINER_DATABASE_URL is required}",
        INITIAL_ADMIN_LOGIN: "${INITIAL_ADMIN_LOGIN:-}",
        INITIAL_ADMIN_NAME: "${INITIAL_ADMIN_NAME:-}",
        INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}",
      }
    depends_on: { db: { condition: service_healthy } }
    profiles: ["ops"]
    networks: [hr]
  db-tools:
    image: postgres:18.1-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-hr}
      PGUSER: ${POSTGRES_USER:-hr}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on: { db: { condition: service_healthy } }
    profiles: ["ops"]
    networks: [hr]
  app:
    image: ${APP_IMAGE_REPOSITORY:-hr}:${VCS_REF:-local}
    build:
      context: .
      target: runtime
      args: { VCS_REF: "${VCS_REF:-local}" }
    environment:
      DATABASE_URL: "${CONTAINER_DATABASE_URL:?CONTAINER_DATABASE_URL is required}"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      APP_ORIGIN: ${APP_ORIGIN:-https://hr.tfoms}
    ports: ["127.0.0.1:${APP_PORT:-3080}:3000"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [hr]
networks: { hr: {} }
volumes: { postgres-data: {} }
