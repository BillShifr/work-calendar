name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
concurrency:
  {
    group: "ci-${{ github.workflow }}-${{ github.ref }}",
    cancel-in-progress: true,
  }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          {
            POSTGRES_DB: tfoms_time_test,
            POSTGRES_USER: tfoms_time,
            POSTGRES_PASSWORD: tfoms_time,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tfoms_time -d tfoms_time_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://tfoms_time:tfoms_time@127.0.0.1:5432/tfoms_time_test
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26.13.0, cache: npm }
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run db:migrate
      - run: npm run db:seed
        env: { INITIAL_ADMIN_PASSWORD: "CI-only-password-2026!" }
      - run: npm run verify
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
