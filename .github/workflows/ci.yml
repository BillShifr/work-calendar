name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: tfoms_time_test
          POSTGRES_USER: tfoms_time
          POSTGRES_PASSWORD: tfoms_time
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tfoms_time -d tfoms_time_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://tfoms_time:tfoms_time@127.0.0.1:5432/tfoms_time_test
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run db:migrate
      - run: npm run db:seed
        env:
          INITIAL_ADMIN_PASSWORD: CI-only-password-2026!
      - run: npm run verify
      - run: npm run test:integration
      - name: Deployment script syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n
      - name: Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          CONTAINER_DATABASE_URL: postgres://tfoms_time:ci-only-database-password@db:5432/tfoms_time
          VCS_REF: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check registry credentials
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo >&2 "Docker Hub credentials are required for main releases"
              exit 1
            fi
          fi
      - name: Docker Login
        if: github.ref == 'refs/heads/main' && steps.registry.outputs.available == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          push: false
          build-args: VCS_REF=${{ github.sha }}
          tags: docker.io/billshifr/tfoms-time:${{ github.sha }}
      - name: Build migrator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrator
          load: true
          push: false
          build-args: VCS_REF=${{ github.sha }}
          tags: docker.io/billshifr/tfoms-time-migrator:${{ github.sha }}
      - name: Verify release images
        env:
          CONTAINER_ENGINE: docker
        run: sh scripts/verify-release-image.sh "${{ github.sha }}"
      - name: Build deployment bundle
        run: |
          mkdir -p dist
          sh scripts/package-deployment-bundle.sh \
            "${{ github.sha }}" \
            "dist/tfoms-time-deploy-${{ github.sha }}.tar.gz"
      - name: Publish deployment bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: tfoms-time-deploy-${{ github.sha }}
          path: dist/tfoms-time-deploy-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Push verified release images
        if: github.ref == 'refs/heads/main' && steps.registry.outputs.available == 'true'
        run: |
          docker push docker.io/billshifr/tfoms-time:${{ github.sha }}
          docker push docker.io/billshifr/tfoms-time-migrator:${{ github.sha }}
